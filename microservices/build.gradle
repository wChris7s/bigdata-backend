subprojects {
  {
    apply {
      plugin "app-palantir.plugin"
    }

    group = 'com.bigdata.app'
    version = '1.0.0'

    // ======================== PALANTIR DOCKER ========================
    // =========== https://github.com/palantir/gradle-docker ===========
    docker {
      name "springbootappbigdata.azurecr.io/${project.name}:latest"
      dockerfile file("src/main/resources/template/Dockerfile")
      files "build/libs/${project.name}-${project.version}.jar"
      buildArgs(['JAR_FILE': "${project.name}-${project.version}.jar"])
    }

    tasks.register('copyDockerTemplate', Copy) {
      from "${rootDir}/docker/template/Dockerfile"
      into project.getLayout().getProjectDirectory().dir("src/main/resources/template")
    }
    // docker.dependsOn build
    // ======================== =============== ========================
  }
}