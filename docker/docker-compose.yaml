services:
  kafka:
    profiles:
      - kafka
    image: confluentinc/cp-kafka:latest
    container_name: kafka_broker
    ports:
      - "9190:9190"
    environment:
      CLUSTER_ID: qZgSnyiuTqWvqKxaG4ST9g
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka_broker:9092,CONTROLLER://kafka_broker:9093,PLAINTEXT_HOST://0.0.0.0:9190
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_broker:9092,PLAINTEXT_HOST://localhost:9190
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka_broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    profiles:
      - kafka
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bigdata_cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka_broker:9092

  jobmanager:
    profiles:
      - flink
    image: flink:latest
    ports:
      - "8081:8081"
    command: standalone-job --job-classname com.opvreal.erp.FlinkKafkaToKafkaJob --jars /opt/flink/usrlib/flink-job-1.0.0.jar
    volumes:
      - ./flink:/opt/flink/usrlib
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2        

  taskmanager:
    profiles:
      - flink
    image: flink:latest
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 1
    volumes:
      - ./flink:/opt/flink/usrlib
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2